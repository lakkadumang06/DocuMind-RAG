[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind - RAG knowledge assistant backend (FastAPI + LangChain + Qdrant)"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Umang Lakkad" }]
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",
    "sse-starlette==3.7.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "langchain==1.4.9",
    "langchain-core==1.7.6",
    "langchain-text-splitters==1.1.3",
    "langchain-openai==1.7.4",
    "langchain-anthropic==1.7.10",
    "langchain-google-genai==4.4.3",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "qdrant-client==1.20.0",
    "rank-bm25==0.2.2",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "langdetect==1.0.9",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "reportlab==5.1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "evals", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
