services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: documind-qdrant
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    container_name: documind-api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      # Ollama runs on the host machine, not in the compose network
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./data:/app/data   # sample docs, uploads, BM25 index and manifest
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: documind-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
